name: Check

# R checks run on every change. Web checks (tsc, vitest, widget rebuild) run
# only when the web side changed, so R-only contributors never need Node.
# The committed widget bundle must match a fresh build from the lockfile:
# one commit = one widget version for R/Shiny and the web editor alike.
#
# Branch protection: require only the `ci-ok` job.

on:
  pull_request:
  push:
    branches: [main, 'release/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Plain git instead of a third-party filter action. When the changed
      # files can't be determined (manual run, new branch, force push), run
      # everything.
      - id: filter
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          case "$EVENT" in
            pull_request) BASE="$PR_BASE" ;;
            push)         BASE="$PUSH_BEFORE" ;;
            *)            BASE="" ;;
          esac
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "Changed files unknown; running all checks."
            echo "web=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CHANGED=$(git diff --name-only "$BASE" HEAD)
          echo "Changed files:"; echo "$CHANGED"
          if echo "$CHANGED" | grep -qE '^(drawsem-web/|inst/htmlwidgets/|inst/extdata/graph\.schema\.json$|\.github/workflows/check\.yml$)'; then
            echo "web=true" >> "$GITHUB_OUTPUT"
          else
            echo "web=false" >> "$GITHUB_OUTPUT"
          fi

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: drawsem-web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: drawsem-web/.nvmrc
          cache: npm
          cache-dependency-path: drawsem-web/package-lock.json

      - run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      - name: Tests
        run: npm test -- --run
      - name: Rebuild widget
        run: npm run build:widget

      - name: Committed widget matches source
        working-directory: .
        run: |
          if [ -n "$(git status --porcelain -- inst/htmlwidgets/lib/app)" ]; then
            git status --short -- inst/htmlwidgets/lib/app
            echo "::error::The committed widget in inst/htmlwidgets/lib/app/ does not match a fresh build. In drawsem-web/, run 'npm ci && npm run build:widget' and commit the result."
            exit 1
          fi

  r-check:
    needs: [changes, web]
    # Run when the web job passed or was skipped; not after a web failure.
    if: >-
      always() && needs.changes.result == 'success'
      && (needs.web.result == 'success' || needs.web.result == 'skipped')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Linux only on pull requests; all three on main, release/** and manual runs.
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest"]' || '["ubuntu-latest", "macos-latest", "windows-latest"]') }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      # TODO: raise error-on to '"warning"' once the R CMD check warnings
      # (imports, Rd mismatches, non-ASCII) are fixed.
      - uses: r-lib/actions/check-r-package@v2
        with:
          args: 'c("--no-manual", "--as-cran")'
          error-on: '"error"'
          upload-snapshots: true

  ci-ok:
    needs: [changes, web, r-check]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for r in $RESULTS; do
            case "$r" in
              success|skipped) ;;
              *) echo "::error::A required job did not pass ($r)."; exit 1 ;;
            esac
          done
