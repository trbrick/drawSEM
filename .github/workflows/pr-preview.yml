name: Deploy PR preview to GitHub Pages (/pr-preview/pr-N)

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

permissions:
  contents: write
  pull-requests: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: pages-preview-${{ github.event.number }}
  cancel-in-progress: false

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        if: github.event.action != 'closed'
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: drawsem-web/package-lock.json

      - name: Install dependencies
        if: github.event.action != 'closed'
        working-directory: drawsem-web
        run: npm ci

      - name: Build standalone app
        if: github.event.action != 'closed'
        working-directory: drawsem-web
        run: npx vite build --base /drawSEM/pr-preview/pr-${{ github.event.number }}/

      - name: Copy example files
        if: github.event.action != 'closed'
        run: cp -r drawsem-web/examples drawsem-web/dist/standalone/examples

      # Deploys on open/push, removes the preview when the PR is closed or merged,
      # and comments the preview link on the PR.
      - name: Deploy or remove preview
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: drawsem-web/dist/standalone
          preview-branch: gh-pages
          umbrella-dir: pr-preview
