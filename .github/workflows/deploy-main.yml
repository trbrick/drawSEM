name: Deploy main to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: pages-main
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: drawsem-web/package-lock.json

      - name: Install dependencies
        working-directory: drawsem-web
        run: npm ci

      - name: Build standalone app
        working-directory: drawsem-web
        run: npx vite build --base /drawSEM/

      - name: Copy example files
        run: |
          cp -r drawsem-web/examples drawsem-web/dist/standalone/examples
          touch drawsem-web/dist/standalone/.nojekyll

      # clean removes stale build files at the root; the other deploy areas are excluded.
      - name: Deploy to GitHub Pages (root)
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: drawsem-web/dist/standalone
          clean: true
          clean-exclude: |
            experimental/
            pr-preview/
